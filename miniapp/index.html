const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();try{tg.disableVerticalSwipes()}catch(e){}try{tg.setHeaderColor("#12151f");tg.setBackgroundColor("#12151f")}catch(e){}}

/* denah */
const AZ=6;/* garis lorong utama */
const DK={SCOUT:[2.6,5.4,2.6,4.2],POSISI:[10.6,13.4,2.6,4.2],LAPORAN:[6.6,9.4,9.4,11]};
const LOC={s_SCOUT:{p:[4,1.8],y:0,c:[[6.5,1.8],[6.5,AZ]]},s_POSISI:{p:[12,1.8],y:0,c:[[9.5,1.8],[9.5,AZ]]},s_LAPORAN:{p:[8,8.6],y:0,c:[[5.2,8.6],[5.2,AZ]]},
 v_SCOUT:{p:[4,5.4],y:Math.PI,c:[[4,AZ]]},v_POSISI:{p:[12,5.4],y:Math.PI,c:[[12,AZ]]},v_LAPORAN:{p:[10.2,8.6],y:-Math.PI/2,c:[[10.2,AZ]]},
 book:{p:[1.9,9.9],y:-Math.PI/2,c:[[1.9,AZ]]},coffee:{p:[14.2,6.8],y:Math.PI,c:[[14.2,AZ]]},sofa:{p:[14.2,10.9],y:-Math.PI/2,c:[[11.8,10.9],[11.8,AZ]]},
 dock:{p:[1.4,13.2],y:Math.PI/4,c:[[1.9,12.2],[1.9,AZ]]},window:{p:[1.1,4.2],y:-Math.PI/2,c:[[1.1,AZ]]},board:{p:[8,1.5],y:2.4,c:[[8,AZ]]}};
const A={};K.forEach((k,i)=>{const l=LOC["s_"+k];A[k]={k,x:l.p[0],z:l.p[1],yaw:0,ty:0,y:1.55,hy:1.55,pose:"sit",at:"s_"+k,path:[],busy:false,abort:false,next:6+i*4,ph:i*2,say:null,bat:100,live:false,v:0,tl:0,hs:{}}});
const LOCK={};const HY={sitTalk:2.35,sit:2.35,sofa:1.9,walk:2.45,stand:2.45,read:2.45,phone:2.45,stretch:2.45,coffee:2.45,charge:2.45,carry:2.45,point:2.45};let DT=.016;
function step(dt){
 DT=dt;
 for(const k of K){
  const a=A[k];
  let tv=0;
  if(a.path.length){
   const[tx,tz]=a.path[0],dx=tx-a.x,dz=tz-a.z,d=Math.hypot(dx,dz),last=a.path.length===1;
   a.ty=Math.atan2(dx,dz);
   tv=last?Math.min(2.3,d*3.2+.12):2.3;
   {const hx=Math.sin(a.ty),hz=Math.cos(a.ty);let blk=false;for(const o of K){if(o===k)continue;const b=A[o],ox=b.x-a.x,oz=b.z-a.z,od=Math.hypot(ox,oz);if(od<2.4&&od>.01&&(ox*hx+oz*hz)>od*.45&&(b.v<.15||K.indexOf(o)<K.indexOf(k)))blk=true}
    a.bw=blk?(a.bw||0)+dt:0;if(blk){if(a.bw<2.2)tv=0;else{a.x+=-hz*.9*dt;a.z+=hx*.9*dt}}}
   const m=Math.min(d,a.v*dt);
   if(d>1e-4){a.x+=dx/d*m;a.z+=dz/d*m}
   if(d<(last?.03:.35)){
    if(last){a.x=tx;a.z=tz}
    a.path.shift();

   }
  }

  a.tl+=(Math.min(a.v,2.3)/2.3*.16-a.tl)*q;
  if(a.pose==="charge")a.bat=Math.min(100,a.bat+dt*8);
 }
 for(const k of K){const a=A[k];if(LOCK.gap===k&&a.gapOut&&a.z>5.1){delete LOCK.gap;a.gapOut=false}
  if(a.pose==="sit"&&!a.path.length)continue;
  for(const o of K){const[x0,x1,z0,z1]=DK[o],m=.7;if(a.x>x0-m&&a.x<x1+m&&a.z>z0-m&&a.z<z1+m){const dl=a.x-(x0-m),dr=x1+m-a.x,dt2=a.z-(z0-m),db=z1+m-a.z,mn=Math.min(dl,dr,dt2,db);if(mn===dl)a.x=x0-m;else if(mn===dr)a.x=x1+m;else if(mn===dt2)a.z=z0-m;else a.z=z1+m}}}

 for(let i=0;i<K.length;i++){
  for(let j=i+1;j<K.length;j++){
   const a=A[K[i]],b=A[K[j]];
   const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);

    const push=(MIN-d)*0.5,nx=dx/d,nz=dz/d;

   }

}

 if(LOCK[a.at]===a.k)delete LOCK[a.at];
 const s=LOC[a.at],d=LOC[dest],pts=[...s.c,...[...d.c].reverse(),d.p];a.pose=a.item?"carry":"walk";await new Promise(r=>{a.path=pts.map(p=>p.slice());a.res=r});a.at=dest;a.ty=d.y;if(seat&&LOCK.gap===a.k)delete LOCK.gap}
const home=async a=>{await move(a,"s_"+a.k);a.pose="sit";a.ty=0};
const wt=(a,s)=>new Promise(r=>{const t0=T;(function c(){a.abort||T-t0>s?r():requestAnimationFrame(c)})()});
const faceTo=(a,b)=>{a.ty=Math.atan2(b.x-a.x,b.z-a.z)};

/* render */
const BOX=[],ITEM=(d,f)=>BOX.push({d,f});
function desk(k){const[x0,x1,z0,z1]=DK[k],cx=(x0+x1)/2,a=A[k];box(x0,x1,z0,z1,0,1.6,"#eef0fa");box(x0,x1,z1-.08,z1,0,1.6,"#d6daee");
 const zc=z0+.7;box(cx-.7,cx+.7,zc-.8,zc,1.6,1.68,"#9a9dc2");box(cx-.7,cx+.7,zc,zc+.07,1.6,2.45,"#6d6f97");
 box(cx+.95,cx+1.12,zc-.55,zc-.32,1.6,1.67,"#3b3f6e");box(x0+.25,x0+.5,z0+.45,z0+.7,1.6,1.88,"#f4f4f4");box(x1-.95,x1-.4,z0+.3,z0+.85,1.6,1.68,"#ffffff");box(x1-.9,x1-.45,z0+.35,z0+.8,1.68,1.72,"#e9ecf8");
 box(x1-.3,x1-.22,z0+.15,z0+.23,1.6,2.5,"#4a4e80");box(x1-.62,x1-.15,z0+.1,z0+.3,2.45,2.58,"#e8c46a");
 if(a.pose==="sit"||a.live){const gl=g.createRadialGradient(...P(cx,1.62,zc-.5),2,...P(cx,1.62,zc-.5),S*1.5);gl.addColorStop(0,COL[k][1]+"66");gl.addColorStop(1,COL[k][1]+"00");g.fillStyle=gl;poly([[x0,1.62,z0],[x1,1.62,z0],[x1,1.62,z1],[x0,1.62,z1]],gl)}
